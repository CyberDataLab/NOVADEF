<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVADEF — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:    #06b6d4;
      --purple:  #7c3aed;
      --blue:    #2563eb;
      --dark:    #0a0e27;
      --glass-bg: rgba(10,14,39,0.60);
      --border:  rgba(255,255,255,0.10);
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
    }

    /* ── Full-screen layered background ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -2;
      background: url('bg-login.jpg') center/cover no-repeat;
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: -1;
      background:
        linear-gradient(135deg, rgba(10,14,39,0.80) 0%, rgba(124,58,237,0.15) 50%, rgba(6,182,212,0.10) 100%),
        rgba(10,14,39,0.75);
      backdrop-filter: blur(2px);
    }

    /* ── Page layout — card centered ── */
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ── Glass card ── */
    .card {
      width: 100%;
      max-width: 24rem;
      background: var(--glass-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .logo-wrap img {
      width: 140px;
      height: 140px;
      object-fit: contain;
    }

    /* ── Mode toggle ── */
    .mode-toggle {
      display: flex;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .mode-toggle button {
      flex: 1;
      padding: 0.5rem;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-toggle button.active {
      background: rgba(6,182,212,0.15);
      color: var(--cyan);
      font-weight: 600;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.35rem;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: #e2e8f0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(6,182,212,0.25);
    }
    input::placeholder { color: #475569; }

    /* Role select (sign-up only) */
    select {
      width: 100%;
      padding: 0.6rem 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: #e2e8f0;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    select option { background: #0a0e27; }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%;
      padding: 0.65rem;
      background: linear-gradient(90deg, var(--purple), var(--blue), var(--cyan));
      border: none;
      border-radius: 0.5rem;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 0.25rem;
    }
    .btn-submit:hover   { opacity: 0.9; }
    .btn-submit:active  { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Domain policy notice ── */
    .domain-notice {
      margin-top: 1rem;
      padding: 0.65rem 0.85rem;
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.25);
      border-radius: 0.5rem;
      font-size: 0.75rem;
      color: #67e8f9;
      line-height: 1.5;
    }
    .domain-notice strong { color: var(--cyan); }

    /* ── Feedback messages ── */
    .msg {
      margin-top: 0.75rem;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      font-size: 0.82rem;
      display: none;
    }
    .msg.error   { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .msg.success { background: rgba(34,197,94,0.10); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .msg.show    { display: block; }

    /* ── Loading spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="page">
  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="novadef-logo.png" alt="NOVADEF Logo" />
    </div>

    <!-- Mode toggle -->
    <div class="mode-toggle">
      <button id="btn-signin" class="active" onclick="setMode('signin')">Sign In</button>
      <button id="btn-signup" onclick="setMode('signup')">Sign Up</button>
    </div>

    <!-- Form -->
    <form id="auth-form" onsubmit="handleSubmit(event)">

      <!-- Name (sign-up only) -->
      <div class="form-group hidden" id="field-name">
        <label for="inp-name">Full Name</label>
        <input type="text" id="inp-name" placeholder="Pedro Beltrán" autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="inp-email">Email address</label>
        <input type="email" id="inp-email" placeholder="you@novadef.local" autocomplete="email" required />
      </div>

      <div class="form-group">
        <label for="inp-password">Password</label>
        <input type="password" id="inp-password" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <!-- Role (sign-up only) -->
      <div class="form-group hidden" id="field-role">
        <label for="inp-role">Role</label>
        <select id="inp-role">
          <option value="USER">Analyst</option>
          <option value="ADMIN">Administrator</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">
        <span class="spinner hidden" id="spinner"></span>
        <span id="btn-label">Sign In</span>
      </button>

      <div class="msg" id="msg-box"></div>
    </form>

    <!-- Domain policy -->
    <div class="domain-notice">
      <strong>Domain Policy</strong><br>
      Access is restricted to authorised email domains.<br>
      Contact your administrator to gain access.
    </div>

  </div>
</div>

<script>
  const API = '';  // same origin
  let currentMode = 'signin';

  function setMode(mode) {
    currentMode = mode;
    const isSignup = mode === 'signup';
    document.getElementById('btn-signin').classList.toggle('active', !isSignup);
    document.getElementById('btn-signup').classList.toggle('active',  isSignup);
    document.getElementById('field-name').classList.toggle('hidden', !isSignup);
    document.getElementById('field-role').classList.toggle('hidden', !isSignup);
    document.getElementById('btn-label').textContent = isSignup ? 'Create Account' : 'Sign In';
    document.getElementById('inp-password').autocomplete = isSignup ? 'new-password' : 'current-password';
    hideMsg();
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg-box');
    el.textContent = text;
    el.className = `msg ${type} show`;
  }
  function hideMsg() {
    const el = document.getElementById('msg-box');
    el.className = 'msg';
  }

  function setLoading(on) {
    document.getElementById('spinner').classList.toggle('hidden', !on);
    document.getElementById('btn-submit').disabled = on;
  }

  async function handleSubmit(e) {
    e.preventDefault();
    hideMsg();
    setLoading(true);

    const email    = document.getElementById('inp-email').value.trim();
    const password = document.getElementById('inp-password').value;

    try {
      if (currentMode === 'signin') {
        const res  = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) { showMsg(data.error || 'Login failed', 'error'); return; }

        localStorage.setItem('novadef_token', data.token);
        localStorage.setItem('novadef_user',  JSON.stringify({ name: data.name, role: data.role }));

        // Optionally start NOVADEF if not running
        try {
          const st = await fetch(`${API}/api/system/status`);
          const sd = await st.json();
          if (!sd.all_up) {
            await fetch(`${API}/api/system/start`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${data.token}` },
            });
          }
        } catch (_) { /* non-fatal */ }

        window.location.href = 'index.html';

      } else {
        const name = document.getElementById('inp-name').value.trim() || email.split('@')[0];
        const role = document.getElementById('inp-role').value;
        const res  = await fetch(`${API}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role }),
        });
        const data = await res.json();
        if (!res.ok) { showMsg(data.error || 'Registration failed', 'error'); return; }
        showMsg(data.message || 'Account created! You can now sign in.', 'success');
        setMode('signin');
      }
    } catch (err) {
      showMsg('Network error — is the API running?', 'error');
    } finally {
      setLoading(false);
    }
  }

  // Redirect to index if already logged in
  (function checkExisting() {
    const tok = localStorage.getItem('novadef_token');
    if (!tok) return;
    fetch(`${API}/api/auth/me`, { headers: { Authorization: `Bearer ${tok}` } })
      .then(r => { if (r.ok) window.location.href = 'index.html'; })
      .catch(() => {});
  })();
</script>

</body>
</html>
