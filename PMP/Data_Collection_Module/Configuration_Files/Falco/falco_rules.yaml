- rule: NOVADEF Lab Ransomware Script Execution
  desc: Detects the launch of the Akira-style lab emulation script.
  condition: evt.type in (execve, execveat) and proc.cmdline contains "akira_lab_emulation.sh"
  output: >
    NOVADEF lab ransomware emulation started
    (user=%user.name command=%proc.cmdline container=%container.name)
  priority: WARNING
  tags: [novadef, ransomware, lab, execution]

- rule: NOVADEF Lab Ransomware File Activity
  desc: Detects file creation, overwrite or rename activity inside the ransomware lab directory.
  condition: evt.type in (open, openat, openat2, creat, rename, renameat, renameat2) and fd.name startswith "/tmp/novadef_ransomware_lab"
  output: >
    NOVADEF lab ransomware file activity
    (user=%user.name command=%proc.cmdline file=%fd.name evt=%evt.type container=%container.name)
  priority: WARNING
  tags: [novadef, ransomware, lab, impact, file]

- rule: NOVADEF Lab Ransom Note Created
  desc: Detects the creation of the simulated ransom note in the lab directory.
  condition: evt.type in (open, openat, openat2, creat) and fd.name="/tmp/novadef_ransomware_lab/!!_READ_ME_!!.txt"
  output: >
    NOVADEF ransom note created
    (user=%user.name command=%proc.cmdline file=%fd.name container=%container.name)
  priority: ERROR
  tags: [novadef, ransomware, lab, ransom-note]

- rule: NOVADEF Lab Canary File Touched
  desc: Detects access to canary files inside the ransomware lab.
  condition: evt.type in (open, openat, openat2, rename, renameat, renameat2) and fd.name startswith "/tmp/novadef_ransomware_lab/.canaries/"
  output: >
    NOVADEF canary file touched
    (user=%user.name command=%proc.cmdline file=%fd.name evt=%evt.type container=%container.name)
  priority: ERROR
  tags: [novadef, ransomware, lab, canary]
