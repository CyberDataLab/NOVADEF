# sudo docker compose up -d
# sudo docker exec -it IDCONTAINER bash
---
services:
  alert_module:
    image: alert_module_novadef:latest
    build:
      context: ${PFD}
      dockerfile: Alert_Module/Docker/Dockerfiles/alert_module.dockerfile
    container_name: alert_module_novadef
    profiles: ["alert_module.alert_module"]
    depends_on:
      kafka_novadef:
        condition: service_healthy
    environment:
      - TZ=UTC
      - KAFKA_BOOTSTRAP=kafka_novadef:29092            # same Docker network
    # If host.docker.internal is used in Linux:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${PFD}/Results/Alerts:/home/Alert_Module/Alerts
      - ${PFD}/Alert_Module/Configuration_Files/Rules:/home/Alert_Module/Snort_configuration/Rules
    restart: unless-stopped

  network_intrusion_detector:
    image: network_intrusion_detector_novadef:latest
    build:
      context: ${PFD}
      dockerfile: Alert_Module/Docker/Dockerfiles/network_intrusion_detector.dockerfile
    container_name: network_intrusion_detector_novadef
    profiles: ["alert_module.network_intrusion_detector"]
    depends_on:
      kafka_novadef:
        condition: service_healthy
    environment:
      - TZ=UTC
      - KAFKA_BOOTSTRAP=kafka_novadef:29092
      - KAFKA_TOPIC_IN=network_auth_events
      - KAFKA_TOPIC_OUT=network_intrusion_alerts
      - DETECTOR_WINDOW_SECONDS=300
      - DETECTOR_MIN_FAILURES=8
      - DETECTOR_MIN_UNIQUE_USERS=4
      - DETECTOR_MIN_UNIQUE_IPS=3
      - DETECTOR_DEDUP_SECONDS=15
    volumes:
      - ${PFD}/Results/Network_IDS:/app/results
    restart: unless-stopped
