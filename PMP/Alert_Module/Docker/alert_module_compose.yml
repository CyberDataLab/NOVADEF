# sudo docker compose up -d
# sudo docker exec -it IDCONTAINER bash
---
services:
  alert_module:
    image: alert_module_novadef:latest
    build:
      context: ${PFD}
      dockerfile: Alert_Module/Docker/Dockerfiles/alert_module.dockerfile
    container_name: alert_module_novadef
    profiles: ["alert_module.alert_module"]
    depends_on:
      kafka_novadef:
        condition: service_healthy
    environment:
      - TZ=UTC
      - KAFKA_BOOTSTRAP=kafka_novadef:29092            # same Docker network
    # If host.docker.internal is used in Linux:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${PFD}/Results/Alerts:/home/Alert_Module/Alerts
      - ${PFD}/Alert_Module/Configuration_Files/Rules:/home/Alert_Module/Snort_configuration/Rules
    restart: unless-stopped
    # entrypoint_alert_module.py runs as PID 1 and spawns Snort3 (start_snort_live)
    # as a direct subprocess. Same zombie-reaping risk as flow_module_novadef/
    # falco_novadef (see their compose comments): a plain script as PID 1 never
    # reaps orphaned descendants it didn't spawn itself. `init: true` runs tini
    # as PID 1 instead, so it happens automatically regardless of cause.
    init: true

  network_intrusion_detector:
    image: network_intrusion_detector_novadef:latest
    build:
      context: ${PFD}
      dockerfile: Alert_Module/Docker/Dockerfiles/network_intrusion_detector.dockerfile
    container_name: network_intrusion_detector_novadef
    profiles: ["alert_module.network_intrusion_detector"]
    depends_on:
      kafka_novadef:
        condition: service_healthy
    environment:
      - TZ=UTC
      - KAFKA_BOOTSTRAP=kafka_novadef:29092
      - KAFKA_TOPIC_IN=tshark_traces
      - KAFKA_TOPIC_OUT=network_intrusion_alerts
      - KAFKA_TOPIC_AUTH_IN=network_auth_events
      - TSHARK_TRACE_PATH=/tshark/traces/infile.ndjson
      - SCENARIO_RUNTIME_DIR=/scenario-runtime
      - DETECTOR_WINDOW_SECONDS=1
      - DETECTOR_WINDOW_PACKETS=12
      - DETECTOR_MIN_FAILURES=1
      - DETECTOR_MIN_UNIQUE_USERS=1
      - DETECTOR_MIN_UNIQUE_IPS=1
      - DETECTOR_DEDUP_SECONDS=5
      - DETECTOR_FAST_PATH_FIRST_FAILURE=true
      - DETECTOR_POLL_TIMEOUT_SECONDS=0.001
      - DETECTOR_IMMEDIATE_AUTH_CAMPAIGN_ALERT=true
      # Run the Isolation Forest alongside the fast fan-in detector so its
      # anomaly_score is captured for the rule-based-vs-ML detection quality
      # comparison in the article. The fan-in path remains primary for
      # DETECTION latency (fires first, unaffected) -- this only adds a
      # parallel, slower ML alert with its own score for measurement.
      - DETECTOR_ISOLATION_FOREST_ENABLED=true
      # TTL del dedup por ataque: alto para garantizar UNA sola alerta durante
      # toda la duración del ataque (~600s). Entre experimentos el API limpia el
      # estado del detector explícitamente (_reset_detector_runtime_state), así
      # que un TTL largo no causa supresión de alertas de runs posteriores.
      - DETECTOR_CAMPAIGN_DEDUP_TTL_SECONDS=1800
    volumes:
      - ${PFD}/Results/Network_IDS:/app/results
      - ${PFD}/Results/tshark/traces:/tshark/traces:ro
      - ${PFD}/../.novadef_runtime/scenarios:/scenario-runtime:ro
    restart: unless-stopped
