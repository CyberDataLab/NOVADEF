input {
  kafka {
    bootstrap_servers => "kafka_novadef:29092"
    topics => ["syslog_logs", "systemd_logs", "falco_events", "telegraf_metrics", "snort_alerts", "tshark_traces", "cic_flow"]
    codec => "json"
    auto_offset_reset => "latest"
    group_id => "logstash_ingestor"
    decorate_events => true 
  }
}

filter {

  if ! [kafka_topic] {
    mutate { add_field => { "kafka_topic" => "%{[@metadata][kafka][topic]}" } }
  }

  # Fluentd
  if [kafka_topic] in ["syslog_logs", "systemd_logs"] {
    grok {
      match => { "message" => "[^{]*(?<json_payload>\{.*)" }
    }

    json {
      source => "json_payload"
      target => "tmp_json_data"
      remove_field => ["json_payload", "message"] 
    }

    mutate {
      rename => { "[tmp_json_data][machine_id]" => "[host][id]" }
      rename => { "[tmp_json_data][host]" => "syslog_hostname" }
      rename => { "[tmp_json_data][message]" => "syslog_message" }
      rename => { "[tmp_json_data][priority]" => "syslog_priority" }
      rename => { "[tmp_json_data][syslog_identifier]" => "syslog_identifier" }
      rename => { "[tmp_json_data][pid]" => "[process][pid]" }
      rename => { "[tmp_json_data][comm]" => "[process][name]" }
    }
    
    mutate { remove_field => ["tmp_json_data"] }

    mutate {
      add_field => { "[event][module]" => "system" }
      add_field => { "[event][dataset]" => "%{kafka_topic}" }
    }
  }

  # Falco
  else if [kafka_topic] == "falco_events" {
    json {
      source => "message"
      target => "tmp_falco"
    }

    mutate {
      rename => { "[tmp_falco][output_fields][machine_id]" => "[host][id]" }
      rename => { "[tmp_falco][hostname]" => "falco_hostname" }
    }
    
    ruby {
        code => '
            event.get("tmp_falco").each do |k, v|
                event.set(k, v) unless k == "hostname"
            end
        '
    }
    mutate { remove_field => ["tmp_falco", "message", "hostname"] }

    mutate {
      add_field => { "[event][module]" => "falco" }
      add_field => { "[event][dataset]" => "alert" }
    }
  }

  # Telegraf
  else if [kafka_topic] == "telegraf_metrics" {
    
    if [event][original] {
        json {
            source => "[event][original]"
            target => "telegraf_clean_data"
        }
    }
    
    mutate {
        rename => { "[telegraf_clean_data][tags][machine_id]" => "[host][id]" }
        rename => { "[telegraf_clean_data][tags][host]" => "[host][name]" }
        rename => { "[telegraf_clean_data][name]" => "[event][dataset]" }
    }

    mutate {
        rename => { "[telegraf_clean_data][tags]" => "telegraf_tags" }
    }

    mutate {
        remove_field => ["telegraf_clean_data", "_tags", "tags", "_tagsparsefailure"]
        add_field => { "[event][module]" => "telegraf" }
    }
  }

  # ── Snort IDS Alerts ──────────────────────────────────────────────────────
  else if [kafka_topic] == "snort_alerts" {
    # Extraer src_ip y dst_ip de src_ap/dst_ap (formato "ip:puerto")
    grok {
      match => { "src_ap" => "^(?<src_ip>[^:]+)(:%{INT:src_port})?$" }
      tag_on_failure => []
    }
    grok {
      match => { "dst_ap" => "^(?<dst_ip>[^:]+)(:%{INT:dst_port})?$" }
      tag_on_failure => []
    }
    mutate {
      add_field => {
        "[event][module]"  => "snort"
        "[event][dataset]" => "alert"
      }
    }
  }

  # ── tshark Network Traces ─────────────────────────────────────────────────
  else if [kafka_topic] == "tshark_traces" {
    ruby {
      code => '
        begin
          layers = event.get("[_source][layers]")
          if layers.is_a?(Hash)
            ip    = layers["ip"]    || {}
            tcp   = layers["tcp"]   || {}
            udp   = layers["udp"]   || {}
            frame = layers["frame"] || {}
            event.set("net_src_ip",  ip["ip.src"])  if ip["ip.src"]
            event.set("net_dst_ip",  ip["ip.dst"])  if ip["ip.dst"]
            proto = ip["ip.proto"].to_s
            proto_name = {"1" => "ICMP", "6" => "TCP", "17" => "UDP"}.fetch(proto, proto)
            event.set("net_proto",   proto_name)   if ip["ip.proto"]
            sp = tcp["tcp.srcport"] || udp["udp.srcport"]
            dp = tcp["tcp.dstport"] || udp["udp.dstport"]
            event.set("net_src_port", sp.to_i) if sp
            event.set("net_dst_port", dp.to_i) if dp
            fl = frame["frame.len"]
            event.set("net_pkt_len",  fl.to_i) if fl
            ts = frame["frame.time"]
            event.set("net_timestamp", ts)     if ts
          end
        rescue => e
          event.tag("_tshark_ruby_error")
        end
      '
    }
    # Eliminar _index/_source: son metadatos Filebeat → OpenSearch los rechaza
    mutate {
      remove_field => ["_index", "_source"]
      add_field => {
        "[event][module]"  => "tshark"
        "[event][dataset]" => "network"
      }
    }
  }

  # ── CICFlowMeter Flows ────────────────────────────────────────────────────
  else if [kafka_topic] == "cic_flow" {
    mutate {
      add_field => {
        "[event][module]"  => "cicflowmeter"
        "[event][dataset]" => "flow"
      }
    }
  }


  # tshark: timestamp ISO8601 del campo net_timestamp (frame.time)
  if [net_timestamp] {
    date {
      match  => [ "net_timestamp", "ISO8601" ]
      target => "@timestamp"
      tag_on_failure => []
    }
  }

  date {
    match => [ "timestamp", "ISO8601", "UNIX", "UNIX_MS",
               "MM/dd-HH:mm:ss.SSSSSS",
               "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd HH:mm:ss.SSS" ]
    target => "@timestamp"
    tag_on_failure => []
  }
}

output {
  opensearch {
    hosts => ["https://${OPENSEARCH_HOST}:9200"]
    index => "logs-%{kafka_topic}-%{+YYYY.MM.dd}"
    user => "admin"
    password => "${OPENSEARCH_PASSWORD}"
    ssl => true
    ssl_certificate_verification => false
  }
}