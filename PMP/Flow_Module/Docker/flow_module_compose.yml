# sudo docker compose up -d
# sudo docker exec -it IDCONTAINER bash
---
services:

  flow_module:
    image: flow_module_novadef:latest
    build:
      context: ${PFD}
      dockerfile: Flow_Module/Docker/Dockerfiles/flow_module.dockerfile
    container_name: flow_module_novadef
    profiles: ["flow_module.flow_module"]
    restart: unless-stopped
    # entrypoint_flow_module.py runs as PID 1 in this container. CICFlowMeter
    # (via scapy) spawns tcpdump as a helper subprocess internally; when that
    # grandchild's immediate parent exits without reaping it, it re-parents to
    # PID 1 — and a plain Python script as PID 1 never reaps processes it
    # didn't launch itself, so those tcpdump children stay zombie forever
    # (observed: 185 accumulated over ~30min of a single scenario's traffic).
    # `init: true` runs the real tini as PID 1 instead, which reaps any
    # orphaned/zombie descendant regardless of which process spawned it.
    init: true
    depends_on:
      kafka_novadef:
        condition: service_healthy
    environment:
      - TZ=UTC
      - KAFKA_BOOTSTRAP=kafka_novadef:29092            # same Docker network
      - KAFKA_ENABLE_AUTO_COMMIT=false
    # If host.docker.internal is used in Linux:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PFD}/Results/Flows:/home/Flow_Module/Results/Flows
      - ${PFD}/Results/Traces_Flow_Module:/home/Flow_Module/Scripts/Parsing/PCAP_Files/
