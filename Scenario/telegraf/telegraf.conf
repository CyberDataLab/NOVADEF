[agent]
  interval = "1s"
  round_interval = true
  collection_jitter = "0s"
  flush_interval = "1s"

# machine_id is the stable per-container identity used by Prometheus and the GUI
# to differentiate metrics across containers. Every benign/victim container gets
# its own copy of this file with a unique machine_id value.
[global_tags]
  machine_id = "scenario_victim"

# Container-scoped CPU from cgroups v2.
# /sys/fs/cgroup inside the container is namespaced — it only sees THIS container's
# usage, never the rest of the Docker VM. cpu.stat exposes usage_usec (cumulative
# microseconds of CPU time consumed by the container across all cores).
[[inputs.cgroup]]
  paths = ["/sys/fs/cgroup"]
  files = ["cpu.stat", "memory.current", "memory.max"]

# cgroups v1 fallback (Linux hosts without cgroups v2)
[[inputs.cgroup]]
  paths = ["/sys/fs/cgroup/cpuacct"]
  files  = ["cpuacct.usage"]

[[outputs.prometheus_client]]
  listen = "0.0.0.0:9274"
  metric_version = 2
