version: "3.9"

services:
  victima:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: scenario_victim
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=novadef
      - USER_PASSWORD=novadef_password
      - PASSWORD_ACCESS=true
      - SUDO_ACCESS=true
    cap_add:
      - NET_ADMIN  # Fundamental para que SOARCA pueda ejecutar iptables dentro
    volumes:
      - ./victim-init:/custom-cont-init.d:ro  # instala iptables al arrancar
      - ./victim-tools:/opt/novadef:ro
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ${SCENARIO_SHARED_LOGS_DIR:-./artifacts/logs}:/var/novadef/logs

  atacante:
    build:
      context: ./attacker-image
    image: novadef-scenario-attacker:latest
    container_name: scenario_attacker
    restart: unless-stopped
    command: /bin/sh -c "tail -f /dev/null"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./attacker-tools:/opt/novadef:ro
      - ${SCENARIO_SHARED_LOGS_DIR:-./artifacts/logs}:/var/novadef/logs
