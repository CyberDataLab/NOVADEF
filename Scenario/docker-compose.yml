version: "3.9"

services:
  victima:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: scenario_victim
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=novadef
      - USER_PASSWORD=novadef_password
      - PASSWORD_ACCESS=true
      - SUDO_ACCESS=true
    cap_add:
      - NET_ADMIN  # Fundamental para que SOARCA pueda ejecutar iptables dentro
    ports:
      - "2222:2222" # SSH externo (si quisieras conectarte a mano)
    volumes:
      - ./victim-init:/custom-cont-init.d:ro  # instala iptables al arrancar
      - ./victim-tools:/opt/novadef:ro
      - ./shared-logs:/var/novadef/logs
    networks:
      - kafka_net

  atacante:
    image: kalilinux/kali-rolling
    container_name: scenario_attacker
    restart: unless-stopped
    command: /bin/sh -c "apt-get update && apt-get install -y nmap hping3 curl iputils-ping iproute2 openssh-client sshpass && tail -f /dev/null"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./attacker-tools:/opt/novadef:ro
      - ./shared-logs:/var/novadef/logs
    networks:
      - kafka_net

networks:
  kafka_net:
    external: true
    name: launcher_default
