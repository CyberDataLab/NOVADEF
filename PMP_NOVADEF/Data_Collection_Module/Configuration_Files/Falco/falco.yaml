engine:
  kind: modern_ebpf
log_output:
  enabled: true

stdout_output:
  enabled: false
json_output: true

file_output:
  enabled: true
  # keep_alive=false makes Falco close and reopen this file on every single
  # event. Under attack bursts (hundreds of events/sec) with the host under
  # CPU pressure, that per-event open/close/flush cycle was adding several
  # seconds of latency before events reached Filebeat. keep_alive=true opens
  # the file once and appends, eliminating that overhead.
  keep_alive: true
  filename: /var/log/falco/falco_events.json

append_output:
  - extra_fields:
      - machine_id: "${MACHINE_ID}"

#Used by the falco_exporter
grpc:
  enabled: true
  bind_address: "unix:///var/run/falco/falco.sock"
  threadiness: 0

grpc_output:
  enabled: true

# NOVADEF only ever runs containers under Docker — cri/podman/lxc/libvirt_lxc/
# bpm are all left at their library default of enabled:true with no matching
# socket on this host (containerd/crio/k3s/podman/lxc sockets don't exist
# here). Falco still probes each enabled engine's socket for every container
# it observes, and each failed probe against a nonexistent socket leaves
# behind a zombie `[timeout] <defunct>` process that Falco never reaps —
# after this container's been running for hours, that accumulates into
# thousands of zombies (observed: ~11,500 after 7.5h). Disabling every engine
# but docker here stops Falco from probing sockets that will never answer.
container_engines:
  docker:
    enabled: true
  cri:
    enabled: false
  podman:
    enabled: false
  lxc:
    enabled: false
  libvirt_lxc:
    enabled: false
  bpm:
    enabled: false