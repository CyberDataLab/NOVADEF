engine:
  kind: modern_ebpf
log_output:
  enabled: true

stdout_output:
  enabled: false
json_output: true
json_include_output_property: true

http_output:
  enabled: true
  # falco runs with network_mode: host, so localhost reaches falcosidekick's published port.
  url: "http://localhost:${FALCOSIDEKICK_LISTEN_PORT}/"

file_output:
  enabled: true
  # keep_alive avoids a per-event open/close/flush cycle that added latency under attack bursts.
  keep_alive: true
  filename: /var/log/falco/falco_events.json

append_output:
  - extra_fields:
      - machine_id: "${MACHINE_ID}"

#Used by the falco_exporter
grpc:
  enabled: true
  bind_address: "unix:///var/run/falco/falco.sock"
  threadiness: 0

grpc_output:
  enabled: true

# Only docker is used in NOVADEF; other engines' nonexistent sockets caused zombie probe processes to pile up.
container_engines:
  docker:
    enabled: true
  cri:
    enabled: false
  podman:
    enabled: false
  lxc:
    enabled: false
  libvirt_lxc:
    enabled: false
  bpm:
    enabled: false