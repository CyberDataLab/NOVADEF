---
services:
  alert_manager:
    image: alert_manager_novadef:latest
    build:
      context: ${PFD}
      dockerfile: Alert_Manager/Docker/Dockerfiles/alert_manager.dockerfile
    container_name: alert_manager_novadef
    profiles: ["alert_manager.alert_manager"]
    labels:
      - "novadef.role=infrastructure"
    environment:
      - TZ=${TZ}
      - KAFKA_BOOTSTRAP=${KAFKA_BOOTSTRAP}
      # Input topics — reused as-is from their producer's own variable name
      - NID_KAFKA_TOPIC_OUT=${NID_KAFKA_TOPIC_OUT}
      - FALCO_BASE_TOPIC=${FALCO_BASE_TOPIC}
      - SNORT_KAFKA_TOPIC_OUT=${SNORT_KAFKA_TOPIC_OUT}
      # Output topics
      - ALERT_MANAGER_PMP_ALERTS=${ALERT_MANAGER_PMP_ALERTS}
      - ALERT_MANAGER_TAPCD_COMPAT_ALERTS=${ALERT_MANAGER_TAPCD_COMPAT_ALERTS}
      # Campaign correlation config
      - ALERT_MANAGER_CAMPAIGN_WINDOW_SECS=${ALERT_MANAGER_CAMPAIGN_WINDOW_SECS}
      - ALERT_MANAGER_CAMPAIGN_TTL_SECS=${ALERT_MANAGER_CAMPAIGN_TTL_SECS}
      - ALERT_MANAGER_KAFKA_GROUP_ID=${ALERT_MANAGER_KAFKA_GROUP_ID}
    # If host.docker.internal is used in Linux:
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${KAFKA_LAN_HOSTNAME:-kafka-host}:host-gateway"
    restart: unless-stopped
