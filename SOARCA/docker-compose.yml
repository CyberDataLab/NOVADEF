version: "3.9"

services:
  # Base de datos Documental para Playbooks de SOARCA
  soarca-db:
    image: mongo:4.4
    container_name: pmp-soarca-db
    restart: on-failure
    environment:
      - MONGO_INITDB_ROOT_USERNAME=soarca
      - MONGO_INITDB_ROOT_PASSWORD=soarca
    volumes:
      - soarca_db_data:/data/db

  # Motor principal de SOARCA (Security Orchestration, Automation and Response)
  soarca-core:
    image: cossas/soarca:latest
    container_name: pmp-soarca-core
    platform: linux/amd64
    restart: on-failure
    ports:
      - "8001:8080"
    environment:
      - DB_URL=mongodb://soarca:soarca@soarca-db:27017/
      - LOG_LEVEL=debug
      - AMQP_BROKER=kafka:9092 # Si usamos MQTT/Kafka, SOARCA tiene plugins, o usa HTTP
    depends_on:
      - soarca-db

  # Ejecutor de acciones (SSH, HTTP, etc)
  soarca-executor:
    image: alpine:latest
    container_name: pmp-soarca-executor-ssh
    command: tail -f /dev/null
    restart: on-failure
    environment:
      - SOARCA_URL=http://soarca-core:8080
    depends_on:
      - soarca-core

  # Trigger: El pegamento entre MISP y SOARCA
  misp-soarca-trigger:
    build: .
    container_name: pmp-misp-soarca-trigger
    restart: on-failure
    environment:
      - MISP_URL=https://misp-server
      - MISP_KEY=NOVADEFMISPINTEGRATIONKEYpmp1234567890ab
      - SOARCA_API=http://soarca-core:8080
      - KAFKA_BOOTSTRAP=kafka_novadef:29092
      - SOARCA_TAPCD_PROFILE_TOPIC=profiles_out
      - SOARCA_USE_TAPCD_STREAM=1
      - SOARCA_ENABLE_MISP_POLLING=0
      - PLAYBOOK_PATH=/app/playbooks/block_ip_range.json
      # Block ONLY the spraying source range (attacker spoofed IPs 172.18.0.160-175).
      # Must NOT cover the benign-noise sources (172.18.0.150-153) so the victim
      # traffic graph drops back to the benign baseline after the countermeasure
      # instead of going to 0 (exp1 is a selective filter, not full isolation).
      - SOARCA_ATTACKER_IP_RANGE_START=172.18.0.160
      - SOARCA_ATTACKER_IP_RANGE_END=172.18.0.175
      - MISP_DB_HOST=misp-db
      - MISP_DB_PORT=3306
      - MISP_DB_USER=misp
      - MISP_DB_PASSWORD=misp_password
      - MISP_DB_NAME=misp
    volumes:
      - trigger_state:/app/state
      - ./playbooks:/app/playbooks:ro
    depends_on:
      - soarca-core

volumes:
  soarca_db_data:
  trigger_state:

networks:
  default:
    external: true
    name: launcher_default
